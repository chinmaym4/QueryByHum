[project]
name = "earworm"
version = "0.1.0"
description = "Query-by-humming over a personal music library"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "numpy>=1.26,<2.3",
    "scipy>=1.11",
    "numba>=0.59",
    "librosa>=0.10",
    "soundfile>=0.12",
    "torch>=2.2",
    "torchaudio>=2.2",
    "torchcrepe>=0.0.23",
    "demucs>=4.0.1",
    "mutagen>=1.47",
    "rapidfuzz>=3.6",
    "requests>=2.31",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
web = ["fastapi>=0.110", "uvicorn>=0.29"]

[project.scripts]
earworm = "earworm.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["earworm"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: synthetic accuracy tests (render + full matching)"]
