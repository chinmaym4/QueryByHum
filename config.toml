# All tunable parameters for earworm. Values here mirror SPEC.md unless noted.

[paths]
data_dir = "data"                  # relative to this file unless absolute

[device]
prefer = "auto"                    # auto | cpu | cuda | mps

[audio]
sample_rate = 16000                # pitch extraction rate (always 16 kHz mono)
separation_sample_rate = 44100     # demucs input rate (stereo)
query_trim_top_db = 40.0           # leading/trailing silence trim for queries

[separation]
model = "htdemucs"
stems = ["vocals", "other"]
overlap = 0.25
segment_split = true

[pitch]
model = "auto"                     # auto (full on GPU, tiny on CPU) | full | tiny
hop_s = 0.01
fmin = 65.0
fmax = 1000.0
batch_size = 2048
periodicity_threshold = 0.5
median_width = 5                   # frames, voiced runs only
octave_jump_min = 11.0             # semitones
octave_jump_max = 13.0
octave_max_s = 0.15                # an excursion shorter than this gets folded back
min_voiced_run_s = 0.05
downsample_factor = 5              # pitch_10ms -> pitch_50ms

[notes]
gap_s = 0.06                       # unvoiced gap longer than this starts a new note
pitch_change = 0.7                 # semitones away from running note median ...
pitch_change_min_s = 0.04          # ... sustained at least this long starts a new note
min_note_s = 0.08                  # shorter notes merge into closest-pitch neighbor

[dtw]
transpose_min = -12
transpose_max = 12
transpose_step = 1
cost_clip = 2.0
coarse = true                      # coarse pass, then full resolution on top candidates
coarse_factor = 2                  # 50 ms -> 100 ms
coarse_transpose_step = 2
refine_top = 50
fine_all_max_songs = 300          # at or below this many songs, all get the full-res pass
key_refine = true                  # full-res pass: fractional key shift from the DTW path, then rescore

[contour]
repeat_threshold = 0.5             # |d| < this -> R
large_threshold = 2.5              # |d| >= this -> U / D
rhythm_threshold = 0.4             # |log2 ratio| > this -> shorter / longer
sub_adjacent = 0.5
sub_far = 1.0
rhythm_mismatch = 0.3
indel = 1.0

[rank]
scales = [0.70, 0.75, 0.80, 0.85, 0.90, 0.95, 1.00, 1.05, 1.10, 1.15, 1.20, 1.25, 1.30, 1.35, 1.40]
hop_s = 0.25
n_points = 24
refine_windows = 5                 # best grid windows re-scanned at a 1-frame start step ...
refine_scale_step = 0.025          # ... and at scale +/- this
tie_tolerance = 0.5                # pitch differences below this (semitones) are ties in Kendall's tau

[fusion]
top_k = 5
offset_matcher = "dtw"             # reported offset comes from this matcher (fallback: highest z)
[fusion.weights]
dtw = 1.0
contour = 1.0
rank = 1.0

[priors]
artist_threshold = 85.0            # rapidfuzz score to count an artist hint as matching
artist_boost = 0.5

[eval]
label_match_threshold = 85.0       # rapidfuzz score to map a label row to a library song
label_ambiguity_margin = 5.0       # warn when the runner-up song scores within this of the best
offset_tolerance_s = 1.0            # an offset within this many seconds of true_offset_s counts as correct

[checkhum]
# Advisory warnings only (`earworm check-hum`); nothing here affects matching or the eval.
min_duration_s = 4.0
max_duration_s = 40.0
min_rms_dbfs = -45.0               # RMS of the silence-trimmed hum
max_clipped_fraction = 0.001       # samples at full scale
min_voiced_fraction = 0.30
min_voiced_s = 3.0
min_notes = 8
min_pitch_range_st = 1.0           # p95 - p5 of voiced pitch

[deezer]
search_url = "https://api.deezer.com/search"
match_threshold = 85.0
requests_per_second = 5.0
timeout_s = 15.0
